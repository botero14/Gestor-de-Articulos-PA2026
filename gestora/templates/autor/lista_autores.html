{% extends "base.html" %} {% block content %}
<div class="container mt-4">
  <h2 class="mb-4 text-dark fw-bold">Autores Registrados</h2>

  <div class="table-responsive shadow-sm rounded">
    <table class="table table-hover table-striped align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th scope="col" class="ps-3">ID</th>
          <th scope="col">Nombre</th>
          <th scope="col" class="pe-3">Apellido</th>
        </tr>
      </thead>
      <tbody>
        {% for autor in autores %}
        <tr>
          <td class="fw-semibold ps-3">{{ autor.id_autor }}</td>
          <td>{{ autor.nombre }}</td>
          <td class="pe-3">{{ autor.apellido }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="3" class="text-center text-muted py-4">
            <i class="bi bi-info-circle me-2"></i>No hay autores registrados.
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <hr />
    <a href="{% url 'index' %}" class="btn btn-dark">Volver al inicio</a>
  </div>
</div>
{% endblock %}
