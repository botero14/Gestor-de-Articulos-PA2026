<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Gestor{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/">Gestor de Artículos</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle text-white fw-semibold"
                href="#"
                id="navbarAutores"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                AUTOR
              </a>
              <ul
                class="dropdown-menu dropdown-menu-end"
                aria-labelledby="navbarAutores"
              >
                <li>
                  <a class="dropdown-item" href="/autor/lista/"
                    >Consultar autores</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="/autor/crear/">Crear autor</a>
                </li>
              </ul>
            </li>

            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle text-white-50"
                href="#"
                id="navbarArticulos"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                ARTICULO
              </a>
              <ul
                class="dropdown-menu dropdown-menu-end"
                aria-labelledby="navbarArticulos"
              >
                <li>
                  <a class="dropdown-item" href="#">Consultar artículo</a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item" href="#">Crear artículo</a></li>
              </ul>
            </li>

            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle text-white-50"
                href="#"
                id="navbarRevistas"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                >REVISTAS
              </a>
              <ul
                class="dropdown-menu dropdown-menu-end"
                aria-labelledby="navbarRevistas"
              >
                <li>
                  <a class="dropdown-item" href="#">Consultar revista</a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item" href="#">Crear revista</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container px-4">{% block content %} {% endblock %}</div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
